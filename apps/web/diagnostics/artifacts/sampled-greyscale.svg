<text x="20.00" y="92.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">drill: model</text>
<text x="20.00" y="109.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">One cell per layer: the summary projection and manifest v1 publish no per-channel partials, so no finer column exists to</text>
