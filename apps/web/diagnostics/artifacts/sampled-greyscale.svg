<text x="20.00" y="226.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Legend</text>
<text x="20.00" y="243.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Colour, fill width and glyph all encode relative weight-space error, sqrt(sum_sq_delta / sum_sq_base).</text>
<text x="20.00" y="260.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">A colour is not a finding. Cell colour, fill and glyph encode one measured quantity — relative weight-space error — and</text>
<text x="20.00" y="277.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">nothing else. What a layer does, and what quantising it costs in accuracy, are not measured here.</text>
<text x="20.00" y="294.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">No column merging was needed: every cell is drawn at the resolution the manifest publishes.</text>
<text x="20.00" y="311.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">The numbers on this map are sampled, which describes how they were obtained. Column merging describes only how they are</text>
<text x="20.00" y="328.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">drawn, and never changes the label a number carries.</text>
<text x="20.00" y="345.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Every measured cell on this map has the same value, 0.2. There is no lightest and no darkest, so no cell is drawn as worse</text>
<text x="20.00" y="362.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">than another, and nothing here says whether 0.2 is large.</text>
<rect class="swatch" x="20.00" y="369.00" width="14.00" height="12.00" fill="#c4c4c4" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<text x="40.00" y="379.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">≡  every measured cell has the same value (0.2); there is no spread to rank</text>
<rect class="swatch" x="20.00" y="386.00" width="14.00" height="12.00" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<text x="40.00" y="396.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">s  every value on this map is sampled</text>
<rect class="swatch" x="20.00" y="403.00" width="14.00" height="12.00" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="40.00" y="413.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">- -  cells with a dashed border aggregate more than one channel, by maximum (factor 1)</text>
<rect class="swatch" x="20.00" y="420.00" width="14.00" height="12.00" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<path class="sampled-mark" data-in="legend" d="M 28.00 420.00 L 34.00 420.00 L 34.00 426.00 Z" fill="#111827"/>
<text x="40.00" y="430.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">◣  a corner wedge marks sampled values from the engine; a dashed border marks columns the renderer merged</text>
<text x="20.00" y="453.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Ranked by relative weight-space error</text>
<text x="20.00" y="470.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Ranked by relative weight-space error, a proxy for sensitivity.</text>
<text x="20.00" y="487.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">1. model.layers[0].mlp.down_projection.weight — 0.2 (1000 params) [sampled]</text>
<text x="20.00" y="510.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Mixed-precision frontier</text>
<text x="20.00" y="527.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Greedy over error-per-byte; not proven optimal.</text>
<text x="20.00" y="544.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">No frontier was computed for this run. The refusals below say why.</text>
