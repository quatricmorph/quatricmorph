<text x="40.00" y="404.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">+  tier 3 of 6 — fill 40%</text>
<rect class="swatch" x="20.00" y="411.00" width="14.00" height="12.00" fill="#fd8d3c" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<text x="40.00" y="421.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">=  tier 4 of 6 — fill 60%</text>
<rect class="swatch" x="20.00" y="428.00" width="14.00" height="12.00" fill="#e31a1c" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<text x="40.00" y="438.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">#  tier 5 of 6 — fill 80%</text>
