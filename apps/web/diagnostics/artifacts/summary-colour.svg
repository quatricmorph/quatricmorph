<rect class="bar" x="346.50" y="157.00" width="393.00" height="22.00" fill="#111827" stroke="none"/>
<text x="153.00" y="173.00" font-family="ui-monospace, monospace" font-size="11" fill="#ffffff">█</text>
<rect class="cell" data-layer="2" data-column="0" data-fidelity="exact" data-cell-fidelity="aggregated" data-aggregated="true" data-defined="true" data-fill-fraction="0.062499999999999986" data-selected="false" data-glyph="·" x="150.00" y="182.00" width="786.00" height="22.00" fill="#ffffcc" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="3 2"/>
<rect class="bar" x="346.50" y="202.63" width="393.00" height="1.37" fill="#111827" stroke="none"/>
<text x="153.00" y="198.00" font-family="ui-monospace, monospace" font-size="11" fill="#111827">·</text>
<text x="20.00" y="234.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Legend</text>
<text x="20.00" y="251.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Colour, fill width and glyph all encode relative weight-space error, sqrt(sum_sq_delta / sum_sq_base).</text>
<text x="20.00" y="268.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">A colour is not a finding. Cell colour, fill and glyph encode one measured quantity — relative weight-space error — and</text>
<text x="20.00" y="285.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">nothing else. What a layer does, and what quantising it costs in accuracy, are not measured here.</text>
<text x="20.00" y="302.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">No column merging was needed: every cell is drawn at the resolution the manifest publishes.</text>
<text x="20.00" y="319.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">The numbers on this map are exact, which describes how they were obtained. Column merging describes only how they are</text>
<text x="20.00" y="336.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">drawn, and never changes the label a number carries.</text>
<text x="20.00" y="353.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">The scale is relative to this map: the lightest cell is 0.1 and the darkest is 0.5. It is not an absolute threshold.</text>
<rect class="swatch" x="20.00" y="360.00" width="14.00" height="12.00" fill="#ffffcc" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<text x="40.00" y="370.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">·  tier 1 of 6 — fill 0%</text>
<rect class="swatch" x="20.00" y="377.00" width="14.00" height="12.00" fill="#ffeda0" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
