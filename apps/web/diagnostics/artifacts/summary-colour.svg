<text x="40.00" y="455.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">█  tier 6 of 6 — fill 100%</text>
<rect class="swatch" x="20.00" y="462.00" width="14.00" height="12.00" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="none"/>
<text x="40.00" y="472.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">e  every value on this map is exact</text>
<rect class="swatch" x="20.00" y="479.00" width="14.00" height="12.00" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="40.00" y="489.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">- -  cells with a dashed border aggregate more than one channel, by maximum (factor 1)</text>
<text x="20.00" y="512.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Ranked by relative weight-space error</text>
<text x="20.00" y="529.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Ranked by relative weight-space error, a proxy for sensitivity.</text>
<text x="20.00" y="546.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">1. model.layers[1].mlp.down_projection.weight — 0.5 (4096 params) [exact]</text>
<text x="20.00" y="563.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">2. model.layers[2].self_attention.query_projection.weight — 0.125 (2048 params) [exact]</text>
<text x="20.00" y="580.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">3. model.layers[0].mlp.up_projection.weight — 0.1 (1024 params) [exact]</text>
<text x="20.00" y="603.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Mixed-precision frontier</text>
<text x="20.00" y="620.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Greedy over error-per-byte; not proven optimal.</text>
<text x="20.00" y="637.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">1. keep 1 tensor(s) — +6144 bytes, 0.5 of squared error removed [exact]</text>
<text x="20.00" y="654.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">2. keep 2 tensor(s) — +9216 bytes, 0.75 of squared error removed [exact]</text>
<text x="20.00" y="677.00" font-family="ui-monospace, monospace" font-size="13" fill="#111827">Declared gaps</text>
<text x="20.00" y="694.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">EVAL-001 — accuracy estimate</text>
<text x="36.00" y="711.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Weight-space error only. Accuracy impact is not measured — run your evaluation on the recommended configuration.</text>
<text x="20.00" y="728.00" font-family="ui-monospace, monospace" font-size="12" fill="#111827">GRID-007 — rank-4 tensor model.layers[1].router.gate_projection.weight</text>
<text x="36.00" y="745.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">ADR-010 implements rank &lt;= 3 and refuses above it; a flattened shape would invite the reader to see adjacency that does</text>
<text x="36.00" y="762.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">not exist.</text>
<text x="20.00" y="785.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">Weight-space error only. Accuracy impact is not measured — run your evaluation on the recommended configuration.</text>
<text x="20.00" y="802.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">A colour is not a finding. Cell colour, fill and glyph encode one measured quantity — relative weight-space error — and</text>
<text x="20.00" y="819.00" font-family="ui-monospace, monospace" font-size="12" fill="#4b5563">nothing else. What a layer does, and what quantising it costs in accuracy, are not measured here.</text>
