<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>distilgpt2 — every layer, every head, real weights</title>
</head>

<body>
  <script type="module">
    //
    // Drives ../index.html (the mm viewer) from a real GPT-2 checkpoint.
    //
    // Everything except the trees below lives in ../src/gpt2page.ts: the
    // specs.json fetch, the status bar, the deep link, the tensor inventory.
    // In particular every leaf's h/w comes from that server's /gpt2/specs.json
    // — never hand-written here — because mm's tryURLInit wraps out-of-range
    // indices (`data[i % data.length]`) and would silently tile a mis-shaped
    // matrix instead of failing.
    //
    import { mount, root, inner, node, leaf, L } from '../src/gpt2page.ts'

    //
    // views
    //
    // mm's expression grammar is matmul-only (viz.js parseExpr maps '@' and
    // nothing else), so GPT-2's two residual additions cannot be drawn as part
    // of the graph. They live in the data instead: the server runs the real
    // forward pass and each `input` leaf below is the actual residual-stream
    // state at that point, for the prompt you type. Every layer and every head
    // is reachable; what you cannot get is all 6 blocks fused into one scene.
    //
    // `kinds` entries are `kind[:flags]` — t=transpose, r/c = apply stride to
    // rows/cols. Stride is only ever applied to an axis that is NOT contracted
    // by the matmul it feeds, so a rendered product is never a partial sum.
    //
    // The `w` and `h` flags augment. mm's grammar is matmul-only, with no '+',
    // so `X @ W + b` is drawn the way it is written when you refuse to leave
    // the language:
    //
    //     X @ W + b  ==  [X | 1] @ [W ; b]
    //
    // The bias becomes one more index along the contraction axis. `w` appends a
    // column (this matrix is a left operand), `h` appends a row (a right one);
    // the server fills the column with the constant 1 and the row with the
    // checkpoint's own bias, sliced to this head and strided with the same
    // output axis. Because the bias is now an ordinary k index, every animation
    // algorithm, block size and partial sum stays correct with no change to
    // viz.ts — and the drawn product is the model's. That was never a rounding
    // detail: bias-free, the layer-2 qkv product sat ~19% of its own range away
    // from the model's. `tools/check_bias.py --layer 2` prints the figure.
    //
    // Two fields say what the picture is, and the status bar prints both:
    //   `bias`  the term now drawn inside the matmul
    //   `gap`   what the drawn product still is not, or null if there is nothing
    //

    const VIEWS = {
      'attention head': {
        kinds: ['ln_1:w', 'ln_1:th', 'wq:h', 'wk_t:w', 'wv:h', 'wo'],
        stride: 1, head: true,
        bias: 'c_attn.bias on Q, K and V',
        // The bias GPT-2 adds after c_proj belongs to the sum over all heads,
        // not to this head's wO slice: adding it here would draw a matrix that
        // is neither the head's contribution nor the layer's output. The server
        // refuses `wo:h` outright rather than let a page ask. See the
        // 'attention output' view, where every head is concatenated and the
        // bias genuinely is a term of the matmul drawn.
        gap: 'attn.c_proj.bias on out — GPT-2 adds it once to the sum over all '
          + 'heads, so it is not a term of this matmul; the "attention output" '
          + 'view draws it where it does belong',
        note: s => `layer ${s.layer} head ${s.head} of ${s.dims.n_head} · head_dim ${s.dims.head_dim}`,
        build: (m, s) => root('out',
          inner('attn @ V',
            inner('attn',
              node('Q', 'input|1', m['ln_1:w'], 'wQ;bq', m['wq:h'],
                'none', L('positive', 'left', 'bottom', 'back')),
              node('K_t', 'wK_t|bk', m['wk_t:w'], 'input_t;1', m['ln_1:th'],
                'none', L('positive', 'right', 'top', 'back')),
              // attn contracts over head_dim here, so mm's sqrt(k) is the
              // right scale — see ../attnqkov, where it is not. Augmenting
              // does not disturb that: the extra index lives inside Q and K_t,
              // whose own contraction is n_embd+1, while attn still contracts
              // over the head_dim columns those two produce.
              'softmax(tril(x/sqrt(k)))', L('negative', 'left', 'top', 'front')),
            node('V', 'input|1', m['ln_1:w'], 'wV;bv', m['wv:h'],
              'none', L('negative', 'right', 'top', 'back')),
            'none', L('positive', 'left', 'bottom', 'back')),
          leaf('wO', m['wo'])),
      },

      'qkv projection': {
        kinds: ['ln_1:w', 'c_attn:ch'],
        stride: 2, head: false,
        bias: 'c_attn.bias',
        gap: null,
        note: s => `layer ${s.layer} · all ${s.dims.n_head} heads at once — columns are [Q | K | V], ${s.dims.n_embd} each`,
        build: (m, s) => root('qkv', leaf('ln_1(x)|1', m['ln_1:w']), leaf('c_attn;b', m['c_attn:ch'])),
      },

      'attention output': {
        kinds: ['attn_out:w', 'attn_c_proj:ch'],
        stride: 1, head: false,
        // every head is concatenated here, so this is the one matmul
        // attn.c_proj.bias is genuinely a term of
        bias: 'attn.c_proj.bias',
        gap: null,
        note: s => `layer ${s.layer} · concatenated head outputs through c_proj`,
        build: (m, s) => root('attn_y', leaf('heads|1', m['attn_out:w']), leaf('c_proj;b', m['attn_c_proj:ch'])),
      },

      'mlp up (gelu)': {
        kinds: ['ln_2:w', 'c_fc:ch'],
        stride: 4, head: false,
        // with the bias inside the matmul, the h drawn here *is* the h the
        // 'mlp down' view consumes. GELU is nonlinear, so that only became
        // true once the bias moved in front of it.
        bias: 'mlp.c_fc.bias',
        gap: 'the affine map is exact, but mm draws GELU in its erf form where '
          + 'GPT-2 trained the tanh form — ~1e-5 relative on the h drawn here',
        note: s => `layer ${s.layer} · ${s.dims.n_embd} → ${4 * s.dims.n_embd} then GELU`,
        build: (m, s) => root('h', leaf('ln_2(x)|1', m['ln_2:w']), leaf('c_fc;b', m['c_fc:ch']), 'gelu'),
      },

      'mlp down': {
        kinds: ['mlp_h:w', 'mlp_c_proj:ch'],
        stride: 4, head: false,
        bias: 'mlp.c_proj.bias',
        gap: null,
        note: s => `layer ${s.layer} · ${4 * s.dims.n_embd} → ${s.dims.n_embd}`,
        build: (m, s) => root('mlp_y', leaf('gelu(h)|1', m['mlp_h:w']), leaf('c_proj;b', m['mlp_c_proj:ch'])),
      },

      'logits (tied wte)': {
        kinds: ['final', 'wte_t:r'],
        stride: 64, head: false,
        bias: null,   // GPT-2's LM head is the tied wte with no bias
        gap: null,
        note: s => `ln_f(x) against the tied embedding — ${s.dims.vocab_size} vocabulary rows`,
        build: (m, s) => root('logits', leaf('ln_f(x)', m['final']), leaf('wte_t', m['wte_t:r'])),
      },
    }

    mount({
      views: VIEWS,
      // caps attn at 64x64; n_ctx is 1024 and would be 1M points
      seq: 64,
      prompt: 'The capital of France is Paris, and the capital of Italy is Rome.'
        + ' Distilled models keep the same shape as their teacher, only fewer layers.',
    })
  </script>
</body>

</html>
