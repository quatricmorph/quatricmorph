<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Attention head explorer — distilgpt2, premultiplied QK/OV</title>
</head>

<body>
  <script type="module">
    //
    // One attention head of a real GPT-2 checkpoint, with the QK and OV
    // circuits premultiplied, driving ../index.html (the mm viewer).
    //
    //   QK      = wQ @ wK_t                    (n_embd × n_embd)
    //   OV      = wV @ wO                      (n_embd × n_embd)
    //   attn    = softmax(tril(input @ QK @ input_t / sqrt(head_dim)))
    //   out     = attn @ input @ OV
    //
    // rather than the conventional factoring in ../attngpt2:
    //
    //   attn    = softmax(tril((input @ wQ) @ (wK_t @ input_t) / sqrt(head_dim)))
    //   out     = (attn @ (input @ wV)) @ wO
    //
    // The two are the same function; what changes is which intermediate you
    // get to look at. Here the head's whole n_embd × n_embd read/write
    // circuits are on screen at once instead of the per-token projections.
    //
    // This page used to load fixed 256-row CSVs from a public bucket of
    // NanoGPT weights. It now reads mm/models/distilgpt2 through
    // tools/gpt2_server.py, with every shape coming from /gpt2/specs.json —
    // see ../src/gpt2page.ts.
    //
    import { mount, root, inner, node, leaf, L } from '../src/gpt2page.ts'

    //
    // The epilog: 'softmax(tril(x/8))', not 'softmax(tril(x/sqrt(k)))'.
    //
    // mm binds `k` in an epilog to the contracted dimension of the matmul it
    // sits on (viz.js `applyPointwiseEpilog` returns `x / Math.sqrt(this.D)`).
    // In the conventional factoring that contraction is over head_dim, so
    // sqrt(k) is the attention scale. Premultiplied, `attn` is
    // `inputQK @ input_t` and contracts over n_embd instead — sqrt(k) would be
    // sqrt(768) ≈ 27.7 where the model divides by sqrt(64) = 8. (Augmented for
    // the bias it is sqrt(769), which is no closer; the literal is what saves
    // this view either way, and it is unaffected by the extra index.)
    //
    // mm's EPILOGS is a fixed list, and the only other scaled softmax in it is
    // the literal `x/8`. That is exactly right for head_dim 64 and wrong for
    // anything else, so `require` below refuses instead of drawing it.
    //
    const SCALED_SOFTMAX_LITERAL = 8

    const ANIMS = {
      'none': { anim: { alg: 'none' } },

      'attn @ input @ OV': {
        anim: { alg: 'vmprod', fuse: 'sync' },
        left: {
          anim: { alg: 'vmprod' },
          left: { anim: { alg: 'none' }, left: { anim: { alg: 'none' } } },
        },
      },

      '+ inputQK @ input_t': {
        anim: { alg: 'vmprod', fuse: 'sync' },
        left: {
          anim: { alg: 'vmprod' },
          left: { anim: { alg: 'vmprod' }, left: { anim: { alg: 'none' } } },
        },
      },

      '+ input @ QK': {
        anim: { alg: 'vmprod', fuse: 'sync' },
        left: {
          anim: { alg: 'vmprod' },
          left: { anim: { alg: 'vmprod' }, left: { anim: { alg: 'vmprod' } } },
        },
      },
    }

    const VIEWS = {
      'attention head (QK/OV)': {
        kinds: ['ln_1:w', 'ln_1:th', 'wq:h', 'wk_t:w', 'wv:h', 'wo'],
        stride: 1, head: true, anims: ANIMS,

        // The QK/OV factoring absorbs the qkv biases exactly, and does it
        // without a special case: augmenting wQ and wK_t makes the premultiplied
        // circuit [wQ;bq] @ [wK_t|bk], and putting [input | 1] on both sides of
        // it gives (x wQ + bq)(x wK + bk)^T — the same scores the conventional
        // form draws. bv rides the same ones column through OV.
        bias: 'c_attn.bias on Q, K and V',

        // Two things this form does not draw. The first is the same as the
        // conventional form's. The second is peculiar to premultiplication and
        // worth stating rather than hiding: `attn @ [input | 1]` reaches bv
        // through attn's row sums, which softmax makes 1 — except that viz.ts
        // deliberately yields a row of zeros rather than NaN when a row
        // underflows, and such a row would drop bv instead of adding it.
        gap: 'attn.c_proj.bias on out, which GPT-2 adds once to the sum over all '
          + 'heads · and bv reaches out through attn\'s row sums, which are 1 by '
          + 'softmax — an underflowed row would carry 0 there and lose it',

        note: s => `layer ${s.layer} of ${s.dims.n_layer}, head ${s.head} of ${s.dims.n_head}`
          + ` · QK and OV are ${s.dims.n_embd + 1}×${s.dims.n_embd + 1} and`
          + ` ${s.dims.n_embd + 1}×${s.dims.n_embd} once augmented, and dominate the`
          + ` point count, so Tokens barely changes it · scaled by the literal`
          + ` ${SCALED_SOFTMAX_LITERAL} = sqrt(head_dim ${s.dims.head_dim}),`
          + ` because premultiplied attn contracts over n_embd, not head_dim`,

        build: (m, s) => root('out',
          inner('attn_out',
            inner('attn',
              inner('inputQK',
                leaf('input|1', m['ln_1:w']),
                node('QK', 'wQ;bq', m['wq:h'], 'wK_t|bk', m['wk_t:w'],
                  'none', L('negative', 'right', 'top', 'back')),
                'none', L('positive', 'left', 'bottom', 'back')),
              leaf('input_t;1', m['ln_1:th']),
              `softmax(tril(x/${SCALED_SOFTMAX_LITERAL}))`, L('negative', 'left', 'top', 'front')),
            leaf('input|1', m['ln_1:w']),
            'none', L('positive', 'left', 'bottom', 'back')),
          node('OV', 'wV;bv', m['wv:h'], 'wO', m['wo'],
            'none', L('positive', 'right', 'top', 'back'))),
      },
    }

    mount({
      views: VIEWS,
      // QK and OV are ~768×768 whatever this is; keep the rest small
      seq: 32,
      seqs: [8, 16, 32, 64, 128],
      prompt: 'The capital of France is Paris, and the capital of Italy is Rome.',

      // Refuse rather than draw the wrong attention scale on a checkpoint whose
      // head_dim is not 64 — mm has no epilog that would divide by sqrt of it.
      require: meta => meta.dims.head_dim === SCALED_SOFTMAX_LITERAL ** 2 ? null
        : `this view needs head_dim ${SCALED_SOFTMAX_LITERAL ** 2}; this checkpoint's is `
        + `${meta.dims.head_dim}. Premultiplied, attn contracts over n_embd `
        + `(${meta.dims.n_embd}, plus one for the bias), so mm's `
        + `softmax(tril(x/sqrt(k))) would divide by `
        + `sqrt(${meta.dims.n_embd + 1}) instead of sqrt(${meta.dims.head_dim}), and the only `
        + `other scaled softmax in mm's EPILOGS is the literal x/${SCALED_SOFTMAX_LITERAL}. `
        + `Refusing rather than drawing an attention pattern at the wrong temperature — `
        + `use ../attngpt2, whose factoring contracts over head_dim and can use sqrt(k).`,
    })
  </script>
</body>

</html>
