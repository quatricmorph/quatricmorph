<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Attention head explorer — distilgpt2, conventional form</title>
</head>

<body>
  <script type="module">
    //
    // One attention head of a real GPT-2 checkpoint, in the conventional
    // formulation, driving ../index.html (the mm viewer).
    //
    //   Q     = input @ wQ
    //   K_t   = wK_t @ input_t
    //   attn  = softmax(tril(Q @ K_t / sqrt(head_dim)))
    //   V     = input @ wV
    //   out   = (attn @ V) @ wO
    //
    // The premultiplied QK/OV form of the same head is ../attnqkov.
    //
    // This page used to load fixed 256-row CSVs from a public bucket of
    // NanoGPT weights. It now reads mm/models/distilgpt2 through
    // tools/gpt2_server.py: `input` is the model's own residual stream after
    // ln_1 for the prompt you type, and wQ/wK/wV/wO are that head's slices of
    // c_attn.weight and attn.c_proj.weight. Shapes come from /gpt2/specs.json,
    // never from literals here — mm's tryURLInit wraps out-of-range indices
    // (`data[i % data.length]`), so a wrong h/w tiles silently instead of
    // failing. See ../src/gpt2page.ts.
    //
    import { mount, root, inner, node, leaf, L } from '../src/gpt2page.ts'

    // Progressive animation depth. Each preset is deep-merged into the built
    // tree, so `left` is `attn @ V`, `left.left` is `attn`, `left.left.left` is
    // `Q` — the same spine the labels name.
    const ANIMS = {
      'none': { anim: { alg: 'none' } },

      'attn @ V @ wO': {
        anim: { alg: 'vmprod', fuse: 'sync' },
        left: {
          anim: { alg: 'vmprod' },
          left: { anim: { alg: 'none' }, left: { anim: { alg: 'none' } } },
        },
      },

      'Q @ K @ V @ wO': {
        anim: { alg: 'vmprod', fuse: 'sync' },
        left: {
          anim: { alg: 'vmprod' },
          left: { anim: { alg: 'vmprod' }, left: { anim: { alg: 'none' } } },
        },
      },

      'input @ wQ @ K @ V @ wO': {
        anim: { alg: 'vmprod', fuse: 'sync' },
        left: {
          anim: { alg: 'vmprod' },
          left: { anim: { alg: 'vmprod' }, left: { anim: { alg: 'vmprod' } } },
        },
      },
    }

    const VIEWS = {
      'attention head': {
        kinds: ['ln_1:w', 'ln_1:th', 'wq:h', 'wk_t:w', 'wv:h', 'wo'],
        stride: 1, head: true, anims: ANIMS,

        // mm's EPILOGS has no '+', so the bias is drawn the only way a
        // matmul-only grammar can draw one: augmented. `[input | 1] @ [wQ ; bq]`
        // is `input @ wQ + bq` exactly, with the bias as one more k index — see
        // ../gpt2/index.html for the full note on the `w` and `h` flags.
        bias: 'c_attn.bias on Q, K and V',

        // attn.c_proj.bias is not a term of this matmul: GPT-2 adds it once to
        // the sum over all heads. Drawing it on one head's wO slice would give
        // a matrix that is neither the head's contribution nor the layer's
        // output, so gpt2_server.py refuses `wo:h`.
        gap: 'attn.c_proj.bias on out — GPT-2 adds it once to the sum over all '
          + 'heads, so it is not a term of this matmul; ../gpt2 "attention '
          + 'output" draws it where it does belong',

        note: s => `layer ${s.layer} of ${s.dims.n_layer}, head ${s.head} of ${s.dims.n_head}`
          + ` · head_dim ${s.dims.head_dim} · conventional form —`
          + ` attn contracts over head_dim, so mm's sqrt(k) is the correct scale`,

        build: (m, s) => root('out',
          inner('attn @ V',
            inner('attn',
              node('Q', 'input|1', m['ln_1:w'], 'wQ;bq', m['wq:h'],
                'none', L('positive', 'left', 'bottom', 'back')),
              node('K_t', 'wK_t|bk', m['wk_t:w'], 'input_t;1', m['ln_1:th'],
                'none', L('positive', 'right', 'top', 'back')),
              // the augmentation is inside Q and K_t, which contract over
              // n_embd+1; attn still contracts over the head_dim columns they
              // produce, so sqrt(k) is still sqrt(head_dim)
              'softmax(tril(x/sqrt(k)))', L('negative', 'left', 'top', 'front')),
            node('V', 'input|1', m['ln_1:w'], 'wV;bv', m['wv:h'],
              'none', L('negative', 'right', 'top', 'back')),
            'none', L('positive', 'left', 'bottom', 'back')),
          leaf('wO', m['wo'])),
      },
    }

    mount({
      views: VIEWS,
      seq: 64,          // attn is n×n; n_ctx is 1024 and would be a million points
      prompt: 'The capital of France is Paris, and the capital of Italy is Rome.'
        + ' Distilled models keep the same shape as their teacher, only fewer layers.',
    })
  </script>
</body>

</html>
