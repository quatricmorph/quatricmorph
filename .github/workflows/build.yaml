name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # No network model downloads in default CI (docs/TESTING.md). Every test runs
  # against `fixtures/`, which is checked in.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      # Includes the Section 7 end-to-end vertical slice
      # (tests/tests/end_to_end_scalar_slice.rs) and the trillion-scale metadata
      # test (crates/q-catalog/tests/trillion_scale_manifest.rs).
      - name: Test
        run: cargo test --workspace

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference SafeTensors implementation
        run: pip install numpy safetensors

      # The checked-in fixture and its golden values must be reproducible from
      # the generator, or the "matches a Python safetensors reference" claim in
      # the end-to-end test is unverifiable.
      - name: Regenerate fixtures and diff
        run: |
          python3 fixtures/generate_fixtures.py
          git diff --exit-code -- fixtures/ \
            || (echo "::error::fixtures/ drifted from fixtures/generate_fixtures.py" && exit 1)

  web:
    name: Web applications
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # matrix-workspace, model-viewer, and query-interface.
      - name: Test
        run: npx vitest run

      - name: Build the matrix workspace
        run: npm run build --workspace matrix-workspace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quatricmorph-matrix-workspace
          path: apps/web/matrix-workspace/dist/
          if-no-files-found: error
          retention-days: 7

  # There is deliberately no CUDA job. `crates/q-cuda` compiles no kernels and
  # links no driver; the `.cu` sources in gpu/cuda/ are HARDWARE-UNVERIFIED and
  # cannot be validated without an RTX 3090. A CI job that "passed" without
  # running them would be worse than no job at all. See STATUS.md (`CUDA-*`) and
  # gpu/cuda/README.md.
