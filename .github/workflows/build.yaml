name: Build QuatricMorph

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quatricmorph

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vite
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quatricmorph-vite-build
          path: quatricmorph/dist/
          if-no-files-found: error
          retention-days: 7
